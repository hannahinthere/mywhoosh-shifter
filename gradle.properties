org.gradle.jvmargs=-Xmx2g
android.useAndroidX=true

# 20260729：命令行打包一直是 Android Studio 在背后喂 JDK，裸跑 ./gradlew 会直接
# 「Unable to locate a Java Runtime」。钉死 Homebrew 的 openjdk@17（对上 build.gradle.kts
# 里的 JavaVersion.VERSION_17），以后 `./gradlew -p <项目> assembleDebug` 开箱即用。
org.gradle.java.home=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
